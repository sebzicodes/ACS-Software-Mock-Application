name: CI

on: 
  push:
  pull:

jobs:
  core: 
    run-ons: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: 
          node-version: 22
          cache: npm
      - run: npm CI
      - run: npm run typecheck --workspace=packages/core
      - run: npm run test --workspace=packages/core
